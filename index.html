<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Cube Naranja — Apps</title>
  <style>
    :root {
      --naranja: #FF6800;
      --crema: #F8F7F4;
      --texto: #2B2B2B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--crema);
      color: var(--texto);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 48px 40px;
      max-width: 480px;
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: var(--naranja);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.6rem; margin-bottom: 8px; }
    .sub { color: #777; margin-bottom: 28px; }
    .app {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 20px;
      text-align: left;
    }
    .app h2 { font-size: 1.1rem; margin-bottom: 6px; }
    .app p { font-size: 0.95rem; color: #555; line-height: 1.5; }
    .contact {
      margin-top: 28px;
      font-size: 0.9rem;
      color: #777;
    }
    .contact a { color: var(--naranja); text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🧮</div>
    <h1>Le Cube Naranja</h1>
    <p class="sub">Apps móviles</p>
    <div class="app">
      <h2>Calculadora de crédito by LCN</h2>
      <p>Calcula y compara créditos de forma simple: cuotas, intereses y
      resúmenes claros que puedes exportar. Disponible para Android en
      Google Play.</p>
    </div>
    <p class="contact">Contacto: <a href="mailto:contacto@lecubenaranja.com">contacto@lecubenaranja.com</a></p>
  </main>
</body>
</html>
